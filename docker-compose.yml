services:
  lisbonpitches:
    image: postgres:18
    environment:
      POSTGRES_DB: lisbonpitches_db
      POSTGRES_USER: lisbonpitches_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - lisbonpitches-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lisbonpitches_user -d lisbonpitches_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PGHOST: lisbonpitches
      PGPORT: "5432"
      PGDATABASE: lisbonpitches_db
      PGUSER: lisbonpitches_user
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      lisbonpitches:
        condition: service_healthy


volumes:
  lisbonpitches-data: